            25%  { text-shadow: 3px 0 0 var(--cyan), -3px 0 0 var(--pink);    transform: translate(-1px, 1px); }
            50%  { text-shadow: -4px 2px 0 var(--cyan), 4px -2px 0 var(--pink); transform: translate(1px, -1px); }
            75%  { text-shadow: 2px -2px 0 var(--cyan), -2px 2px 0 var(--pink); transform: translate(0, 1px); }
            100% { text-shadow: -2px -1px 0 var(--cyan), 2px 1px 0 var(--pink); transform: translate(0, 0); }
        }

        /* ---------- Top tabs ---------- */
        .tab { color: rgba(255,255,255,0.6); font-weight: 600; font-size: 16px; position: relative; padding-bottom: 6px; }
        .tab.active { color: #fff; font-weight: 700; }
        .tab.active::after {
            content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
            width: 26px; height: 3px; border-radius: 2px; background: #fff;
        }

        /* ---------- Machine ---------- */
        .machine {
            background: linear-gradient(180deg, #1c1d28 0%, #111218 100%);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 22px;
            box-shadow: -4px -4px 0 var(--cyan), 4px 4px 0 var(--pink);
            transition: transform 0.2s;
        }
        .machine.win { animation: duo-pulse 0.35s ease-in-out infinite alternate; }
        @keyframes duo-pulse {
            from { box-shadow: -4px -4px 0 var(--cyan), 4px 4px 0 var(--pink); transform: scale(1); }
            to   { box-shadow: -8px -6px 0 var(--cyan), 8px 6px 0 var(--pink), 0 0 50px rgba(254,44,85,0.45); transform: scale(1.03); }
        }

        .reel {
            position: relative;
            flex: 1;
            aspect-ratio: 3 / 4;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(180deg, #08080b 0%, #20212c 28%, #2c2e3b 50%, #20212c 72%, #08080b 100%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 18px rgba(0,0,0,0.8);
        }
        .reel::before, .reel::after {
            content: ''; position: absolute; left: 0; right: 0; height: 22%; z-index: 2; pointer-events: none;
        }
        .reel::before { top: 0;    background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent); }
        .reel::after  { bottom: 0; background: linear-gradient(0deg,   rgba(0,0,0,0.85), transparent); }

        .reel-symbol {
            width: 72%; height: 72%; object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)) drop-shadow(0 0 10px rgba(255,190,60,0.35));
        }
        .reel-hit .reel-symbol { animation: hit 0.35s ease-out; }
        @keyframes hit {
            0%   { transform: scale(1.4) rotateY(180deg); filter: drop-shadow(-5px 0 0 var(--cyan)) drop-shadow(5px 0 0 var(--pink)) brightness(1.3); }
            100% { transform: scale(1) rotateY(0deg);     filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)) drop-shadow(0 0 10px rgba(255,190,60,0.35)); }
        }
        .spin-sym { font-size: 2.25rem; }

        .reel-blur { animation: vertical-blur 0.1s infinite; }
        @keyframes vertical-blur {
            0%   { transform: translateY(-6px); filter: blur(2px); }
            50%  { transform: translateY(6px);  filter: blur(2px); }
            100% { transform: translateY(-6px); filter: blur(2px); }
        }

        /* ---------- Right rail ---------- */
        .rail-btn {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            font-size: 12px; font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            transition: transform 0.15s;
        }
        .rail-btn:active { transform: scale(0.88); }
        .rail-btn svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
        #like-btn { position: relative; }
        #like-btn svg { transition: fill 0.15s; }
        #like-btn.liked svg { fill: var(--pink); filter: drop-shadow(0 0 8px rgba(254,44,85,0.55)); animation: like-pop 0.45s cubic-bezier(.2,1.6,.4,1); }
        #like-btn.unliked svg { animation: unlike-pop 0.25s ease-out; }
        @keyframes like-pop   { 0% { transform: scale(0.3); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
        @keyframes unlike-pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        .like-count { display: inline-block; }
        .like-count.bump { animation: count-bump 0.3s ease-out; }
        @keyframes count-bump { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        .like-burst {
            position: absolute; left: 50%; top: 17px; width: 0; height: 0; pointer-events: none;
        }
        .like-burst i {
            position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
            animation: burst 0.5s ease-out forwards;
        }
        @keyframes burst {
            0%   { transform: rotate(var(--a)) translateY(0) scale(1); opacity: 1; }
            100% { transform: rotate(var(--a)) translateY(-30px) scale(0.2); opacity: 0; }
        }

        .disc {
            width: 44px; height: 44px; border-radius: 50%;
            background: radial-gradient(circle, #3a3a3a 0 32%, #161616 33% 100%);
            border: 7px solid #222;
            display: flex; align-items: center; justify-content: center;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Docked like TikTok: bottom-right, disc level with the sound line */
        .rail-dock {
            position: absolute; right: 6px; bottom: -8px; z-index: 30;
        }
        .stage   { padding-right: 72px; }   /* keep the machine clear of the rail */
        .caption { padding-right: 76px; }   /* caption text stops before the rail */
        .rail .disc { margin-top: 4px; }

        /* ---------- Caption & live feed ---------- */
        .marquee { overflow: hidden; white-space: nowrap; flex: 1; min-width: 0; }
        .marquee span { display: inline-block; }
        .marquee.overflow span { animation: marquee 6s ease-in-out infinite alternate; }
        @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--shift)); } }

        .feed-item {
            display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
            max-width: 100%;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(6px);
            border-radius: 999px;
            padding: 3px 10px 3px 3px;
            font-size: 12.5px;
            animation: feed-in 0.3s ease-out;
            transition: opacity 0.4s, transform 0.4s;
        }
        .feed-item.gift { background: linear-gradient(90deg, rgba(254,44,85,0.55), rgba(254,44,85,0.10)); }
        .feed-item.out { opacity: 0; transform: translateY(-6px); }
        .feed-avatar {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #000;
        }
        @keyframes feed-in { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }

        /* ---------- Play button ---------- */
        .play-btn {
            width: 100%; height: 54px; border-radius: 10px;
            background: var(--pink);
            font-weight: 800; font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: -3px 3px 0 var(--cyan);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        .play-btn:hover { box-shadow: -5px 5px 0 var(--cyan), 5px -5px 0 rgba(255,255,255,0.9); }
        .play-btn:active { transform: scale(0.97); box-shadow: -1px 1px 0 var(--cyan); }
        .play-btn.disabled { opacity: 0.55; cursor: not-allowed; }

        .nav-btn { font: inherit; transition: transform 0.15s, color 0.15s; }
        .avatar-btn { transition: transform 0.15s; }
        .avatar-btn:active { transform: scale(0.9); }
        .nav-btn:active { transform: scale(0.88); color: #fff; }

        .balance-reset { animation: balance-reset 0.5s ease-out; }
        @keyframes balance-reset {
            0%   { color: var(--pink); transform: scale(1.15); }
            100% { color: #fff; transform: scale(1); }
        }

        /* ---------- Particles ---------- */
        .coin-particle {
            position: absolute; pointer-events: none; z-index: 50;
            animation: float-up 1s ease-out forwards;
        }
        @keyframes float-up {
            0%   { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .heart-particle {
            position: absolute; pointer-events: none; z-index: 45;
            animation: heart-float 1.6s ease-out forwards;
        }
        @keyframes heart-float {
            0%   { transform: translate(0, 0) scale(0.4) rotate(var(--r)); opacity: 0; }
            15%  { transform: translate(0, -20px) scale(1) rotate(var(--r)); opacity: 1; }
            100% { transform: translate(var(--dx), -240px) scale(0.8) rotate(var(--r)); opacity: 0; }
        }

        .tap-heart {
            position: absolute; pointer-events: none; z-index: 46;
            width: 96px; height: 96px;
            animation: tap-heart 0.9s ease-out forwards;
        }
        @keyframes tap-heart {
            0%   { transform: translate(-50%, -50%) scale(0) rotate(var(--r)); opacity: 0; }
            15%  { transform: translate(-50%, -50%) scale(1.25) rotate(var(--r)); opacity: 1; }
            30%  { transform: translate(-50%, -50%) scale(1) rotate(var(--r)); }
            70%  { transform: translate(-50%, -50%) scale(1) rotate(var(--r)); opacity: 1; }
            100% { transform: translate(-50%, -160%) scale(1.4) rotate(var(--r)); opacity: 0; }
        }

        #progress { transition: width 0.7s linear; }

        @media (prefers-reduced-motion: reduce) {
            .disc, .marquee span { animation: none; }
        }
    </style>
</head>

        function localPoint(clientX, clientY) {
            const r = phone.getBoundingClientRect();
            return { x: clientX - r.left - phone.clientLeft, y: clientY - r.top - phone.clientTop };
        }

        // ---------- Sound Engine (Web Audio API) ----------
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function buzz(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }
        function playTone(freq, type, duration) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSpinSound() {
            let i = 0;
            const spinInt = setInterval(() => {
                if (!isSpinning) { clearInterval(spinInt); return; }
                playTone(300 + (i % 3) * 100, 'square', 0.1);
                i++;
            }, 100);
        }

        // ---------- Hearts ----------
        function heartSVG(cls, style) {
            return `<svg viewBox="0 0 24 24" class="${cls}" style="${style}"><path d="${HEART_PATH}" fill="#FE2C55"/></svg>`;
        }

        function spawnRailHearts(n) {
            const r = likeBtn.getBoundingClientRect();
            const p = localPoint(r.left + r.width / 2, r.top);
            for (let i = 0; i < n; i++) {
                setTimeout(() => {
                    const wrap = document.createElement('div');
                    const size = 18 + Math.random() * 16;
                    const dx = (Math.random() * 60 - 45).toFixed(0) + 'px';
                    const rot = (Math.random() * 40 - 20).toFixed(0) + 'deg';
                    wrap.innerHTML = heartSVG('heart-particle', `left:${p.x - size / 2}px;top:${p.y}px;width:${size}px;height:${size}px;--dx:${dx};--r:${rot}`);
                    const el = wrap.firstChild;
                    phone.appendChild(el);
                    setTimeout(() => el.remove(), 1600);
                }, i * 90);
            }
        }

                dot.style.background = colors[i % colors.length];
                burst.appendChild(dot);

            balanceAnim = setInterval(() => {
                current += dir * step;

                    clearInterval(balanceAnim);

            const from = balance;
            balance = 0;
            animateBalance(from, 0, Math.max(50, Math.ceil(from / 30)));
            elBalance.classList.remove('balance-reset');
            void elBalance.offsetWidth;
            elBalance.classList.add('balance-reset');
            buzz(20);
        }
        document.getElementById('profile-btn').addEventListener('click', resetCoins);
        document.getElementById('avatar-btn').addEventListener('click', resetCoins);

        // ---------- Core Logic ----------
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            initAudio();
            buzz(10);

            elWinMessage.style.opacity = 0;
            machine.classList.remove('win');
            elTitle.classList.remove('active');
            btnSpin.classList.add('disabled');

            progress.style.transition = 'none';
            progress.style.width = '0%';
            void progress.offsetWidth;
            progress.style.transition = '';
            progress.style.width = '100%';

            playSpinSound();

            const spinIntervals = [];
            reels.forEach((reel, index) => {
                reel.classList.add('reel-blur');
                reel.parentElement.classList.remove('reel-hit');

                spinIntervals[index] = setInterval(() => {
                    reel.innerHTML = `<span class="spin-sym">${rand(blurSymbols)}</span>`;
                }, 30);

                setTimeout(() => {
                    clearInterval(spinIntervals[index]);
                    reel.classList.remove('reel-blur');
                    reel.innerHTML = winSymbolHTML;
                    void reel.parentElement.offsetWidth;
                    reel.parentElement.classList.add('reel-hit');
                    playTone(400 + index * 200, 'triangle', 0.2);
                    buzz(15);

                    if (index === 2) handleWin();
                }, 300 + index * 200);
            });
        }

        function handleWin() {
            isSpinning = false;

            const winAmount = 5000;
            balance += winAmount;

            animateBalance(balance - winAmount, balance, 500);

            elWinMessage.style.opacity = 1;
            machine.classList.add('win');
            elTitle.classList.add('active');
            setTimeout(() => elTitle.classList.remove('active'), 1500);
            btnSpin.classList.remove('disabled');

            likes += 120 + Math.floor(Math.random() * 300);
            showLikes();
            viewers += 200 + Math.floor(Math.random() * 400);
            elViewers.innerText = fmtK(viewers);

            playWinSound();
            buzz([40, 40, 90]);
            spawnCoins();
            spawnRailHearts(10);
            pushGift();
            setTimeout(pushGift, 350);
            setTimeout(pushComment, 700);
        }

        btnSpin.addEventListener('click', spin);

        // Sound line: shown once; slides only if it doesn't fit
        function fitSoundLine() {
            const box = document.querySelector('.marquee');
            const text = box.querySelector('span');
            const overflow = text.scrollWidth - box.clientWidth;
            box.classList.toggle('overflow', overflow > 0);
            box.style.setProperty('--shift', -Math.max(overflow, 0) + 'px');
        }
        fitSoundLine();
        window.addEventListener('resize', fitSoundLine);
    </script>
</body>
</html>
